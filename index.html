const EMBEDDED=[{"text":"每年6月，在非洲东部，成群结队的角马，从坦桑尼亚的塞伦盖蒂保护区出发，迁徙至肯尼亚的马赛马拉国家公园。","para":0,"audio":"audio/001.mp3"},{"text":"这场壮观的角马大迁徙被誉为“自然界七大奇观”之一。","para":0,"audio":"audio/002.mp3"},{"text":"其背后不仅有气势磅礴的景象，更蕴含着残酷的生存法则——这是动物们在大自然中争夺生存权的过程，也是大自然对它们的严苛考验。","para":0,"audio":"audio/003.mp3"},{"text":"角马又称牛羚，是牛科角马属动物，主要分布在撒哈拉沙漠以南的非洲地区。","para":1,"audio":"audio/004.mp3"},{"text":"它们以青草为食，尤其喜爱新鲜的嫩草。","para":1,"audio":"audio/005.mp3"},{"text":"然而，非洲草原终年高温干旱，雨季一过，草木枯黄，水源逐渐干涸。","para":1,"audio":"audio/006.mp3"},{"text":"为了寻找食物和水源，角马必须踏上漫长的迁徙之路。","para":1,"audio":"audio/007.mp3"},{"text":"角马是群居动物。","para":2,"audio":"audio/008.mp3"},{"text":"到了迁徙季节，它们会自动聚集在一起，并与成群的斑马等动物结伴而行，展开长达数月的长途跋涉。","para":2,"audio":"audio/009.mp3"},{"text":"即使是刚出生不久的小角马，也必须随群同行。","para":2,"audio":"audio/010.mp3"},{"text":"为了生存，它们必须经受一路上的严酷考验，只有存活下来，才能继续繁衍。","para":2,"audio":"audio/011.mp3"},{"text":"在漫长的迁徙途中，由于路途遥远、自然环境复杂，一路危险重重，杀机四伏。","para":3,"audio":"audio/012.mp3"},{"text":"最危险的关卡就是横亘在草原上的马拉河，河中潜伏着鳄鱼和河马，伺机捕食过河的角马。","para":3,"audio":"audio/013.mp3"},{"text":"当百万角马集体渡河时，被踩踏、溺亡和被捕食几乎每时每刻都在发生。","para":3,"audio":"audio/014.mp3"},{"text":"据统计，每年有数千头角马死在这里，因此这一地段被称为“死亡之角”。","para":3,"audio":"audio/015.mp3"},{"text":"除了渡河的险境，角马们还要面对狮子、猎豹和非洲野犬等天敌的追捕。","para":4,"audio":"audio/016.mp3"},{"text":"生死搏斗随处可见，这就是残酷而真实的自然法则——优胜劣汰。","para":4,"audio":"audio/017.mp3"},{"text":"在9月至11月之间，马赛马拉草原遍布迁徙动物的身影，一些幸运的角马能在这里享受短暂的休养生息。","para":5,"audio":"audio/018.mp3"},{"text":"但到了11月至12月，草原食物几乎被消耗殆尽，而塞伦盖蒂草原则迎来雨季，草木开始复苏。","para":5,"audio":"audio/019.mp3"},{"text":"角马们又踏上返程，然而能成功回到原地的仅占原来数量的40%。","para":5,"audio":"audio/020.mp3"},{"text":"幸运的是，成功返回的角马会在次年1月至3月繁衍后代，这些新生命将成为下一次大迁徙的主力军。","para":5,"audio":"audio/021.mp3"},{"text":"角马的生存策略，就是通过不断迁徙来获取充足的水源和食物。","para":6,"audio":"audio/022.mp3"},{"text":"因此，每年东非大草原上都会上演这场壮美而震撼的自然奇观。","para":6,"audio":"audio/023.mp3"}];
function normalize(x){return x.map((item,i)=>{if(!Array.isArray(item.characters)||item.characters.length===0){item.characters=Array.from(item.text||'').map(c=>({char:c,py:'',audio:null}));}if(!Array.isArray(item.timing))item.timing=[];if(!item.audio)item.audio='audio/'+String(i+1).padStart(3,'0')+'.mp3';return item})}
data=normalize(EMBEDDED);if(window.pinyinPro){for(const item of data){for(const c of item.characters){if(/[\u3400-\u9fff]/.test(c.char))c.py=window.pinyinPro.pinyin(c.char);}}}make();status('课文已显示 · 点击播放开始跟读');

const paragraphs2=["这本书的外形看起来和普通的图书一模一样，却被《时代》周刊评为2015年最佳的25个设计之一。它的封面和扉页上都印着“Drinking Book”（可以喝的书），显得格外与众不同。这本神奇的书，甚至改变了全球6.63亿缺乏安全饮用水的人的命运！这本书的发明者是美国一个叫特丽莎的人。","2007年，特丽莎到非洲旅行时，发现当地居民没有干净的饮用水。孩子们口渴了，就直接从垃圾堆旁的水坑里舀水喝。水坑里的水浑浊又肮脏，里面还有无数肉眼看不到的细菌。因此，当地的居民患病的概率特别高，甚至常因各种疾病而死亡。","特丽莎了解到，全球有数亿人因缺乏安全饮水而导致疾病与死亡，其中在发展中的国家更为严重。作为一名化学博士，她顿生强烈的使命感：能不能发明一种能够有效消灭细菌的物质呢？","经过8年的研究和实验，她终于找到细菌的克星——纳米银离子。为了让这种技术更便捷地使用，特丽莎灵机一动：把纳米银离子嵌入纸中，制成一张特殊的抗菌过滤纸。她反复钻研，终于成功将纳米银离子嵌入纸张，做出了抗菌性极强、质地优良的黄色纸。实验表明，这种纸能去除水中99.99%的细菌，使过滤后的水达到直接饮用的标准。","特丽莎把这些纸带到南非、肯尼亚、海地、印度等国家，测试了25种受到污染的水源，并和当地居民一起试用。然而，居民们觉得操作麻烦，并不愿意使用。这让特丽莎意识到，单靠技术并不足够，更严重的问题是人们缺乏基本的安全饮水常识。","特丽莎想到了一个妙计：把这些特殊的纸做成一本书，然后用可食用的墨水印上安全饮水的常识。如此一来，书页既能传播健康知识，又能作为过滤纸使用。","这本“可以喝的书”里的每页纸上，都写着温馨的提示语，提醒人们安全饮水的重要性。这本书的设计也相当巧妙和便捷：使用时，只需把包装盒拼好，把书页撕下一张放在盒底，再倒入脏水，经过过滤，就能获得干净的水。这本看似小巧的书，每页平均可以过滤100升水，一本26页的书，足够一个人使用4年！","这项发明一经推出，便引起轰动。BBC、NBC、CTV等知名媒体纷纷报道。面对滚滚而来的赞誉，特丽莎风趣地说：“我只是想用自己的知识给人们带来一点改变。只要我们内心温暖、心怀世界，别说一本可以‘喝’的书，也许未来我们还能发明出能‘吃’的书呢！”"];
function newData(){return paragraphs2.flatMap((p,para)=>(p.match(/[^。！？]+[。！？]+[”]?|[^。！？]+$/g)||[p]).map(text=>{const chars=Array.from(text);let py=[];try{py=window.pinyinPro.pinyin(text,{type:'array',nonZh:'consecutive'});if(py.length!==chars.length)py=window.pinyinPro.pinyin(text,{type:'array',nonZh:'spaced'});}catch(e){}return {text,para,characters:chars.map((char,i)=>({char,py:/[\u3400-\u9fff]/.test(char)?(py.length===chars.length?py[i]:(window.pinyinPro?.pinyin(char)||'')):'',audio:null}))}}))}
function speakNew(i,keep,j){if(!window.speechSynthesis){status('此浏览器不支持朗读');return;}const t=++token;speechSynthesis.cancel();audio.pause();continuous=keep;mode=j===undefined?'sentence':'character';setCurrent(i,j??-1);const u=new SpeechSynthesisUtterance(j===undefined?data[i].text:data[i].characters[j].char);utterance=u;u.lang='zh-CN';const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/zh[-_]CN/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(!voice){mode='';status('未检测到华语语音，请在设备语音设置中启用普通话（中国）后重试。');return;}u.voice=voice;u.lang=voice.lang;u.rate=Number($('speed').value);u.onboundary=e=>{if(t===token&&j===undefined)setCurrent(i,Array.from(u.text.slice(0,e.charIndex)).length)};u.onstart=()=>{if(t===token&&j===undefined)setCurrent(i,0)};u.onend=()=>{if(t!==token)return;if(keep&&i<data.length-1){if($('follow')?.checked){status('请跟读 · 3秒');followTimer=setTimeout(()=>{if(t===token)playSentence(i+1,true)},3000)}else playSentence(i+1,true);}else{mode='';status('朗读结束')}};u.onerror=e=>{if(t===token)status('朗读失败：'+e.error)};status(j===undefined?'正在朗读 · 第 '+(i+1)+' / '+data.length+' 句':'单字：'+u.text);$('pause').textContent='⏸ 暂停';speechSynthesis.speak(u)}
$('lesson').onchange=()=>{++token;window.speechSynthesis?.cancel();stop();lesson=Number($('lesson').value);data=lesson===1?(originalData||normalize(EMBEDDED)):newData();document.querySelector('.storycover h1').textContent=lesson===1?'角马大迁徙':'一本可以喝的书';document.querySelector('.eyebrow').textContent=lesson===1?'自然探索 · 有声绘本':'科学探索 · 有声阅读';document.querySelector('.sub').textContent=lesson===1?'一场跨越东非草原的生命旅程':'用知识改变世界';document.querySelector('.savanna').style.display=lesson===1?'':'none';make();$('lyrics').scrollTop=0;status('课文已显示 · 点击播放开始跟读')};
const oldPause=$('pause').onclick;$('pause').onclick=()=>{if(true){oldPause();return;}if(speechSynthesis.paused){speechSynthesis.resume();$('pause').textContent='⏸ 暂停'}else if(speechSynthesis.speaking){speechSynthesis.pause();$('pause').textContent='▶ 继续'}};
let enginePromise=null,readingTimer=null,followTimer=null;
function getEngine(){if(!enginePromise){enginePromise=import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm').then(m=>m.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{dtype:'q8',device:'wasm'})).catch(e=>{enginePromise=null;throw e});}return enginePromise}
async function googleSpeak(i,keep,j){const t=++token;clearTimeout(followTimer);audio.pause();window.speechSynthesis?.cancel();continuous=keep;mode=j===undefined?'sentence':'character';setCurrent(i,j??-1);const phrase=j===undefined?data[i].text:data[i].characters[j].char;status('正在准备华语朗读……');$('pause').textContent='⏸ 暂停';try{const engine=await getEngine();if(t!==token)return;const result=await engine.generate(phrase,{voice:'zf_xiaobei',speed:1});if(t!==token)return;const blob=result.toBlob();if(audio.src.startsWith('blob:'))URL.revokeObjectURL(audio.src);audio.src=URL.createObjectURL(blob);audio.playbackRate=Number($('speed').value);await audio.play();status('正在朗读 · '+(j===undefined?'第 '+(i+1)+' / '+data.length+' 句':phrase));}catch(e){if(t!==token)return;status('模型加载失败，尝试设备普通话语音');speakNew(i,keep,j);}}
audio.onerror=()=>{continuous=false;status('音频播放失败，请重试。')};
const follow=document.createElement('label');follow.innerHTML='<input type="checkbox" id="follow"> 跟读停顿3秒';document.querySelector('.controls').append(follow);
audio.onended=()=>{if(mode==='sentence'&&continuous&&idx<data.length-1){const next=idx+1,t=token;if($('follow').checked){status('请跟读 · 3秒');followTimer=setTimeout(()=>{if(t===token)playSentence(next,true)},3000)}else playSentence(next,true)}else{continuous=false;mode='';status('朗读结束')}};
$('pause').onclick=()=>{if(window.speechSynthesis?.speaking){if(speechSynthesis.paused){speechSynthesis.resume();$('pause').textContent='⏸ 暂停'}else{speechSynthesis.pause();$('pause').textContent='▶ 继续'}return;}if(audio.paused&&audio.src){audio.play().catch(()=>status('请重新点击朗读'));$('pause').textContent='⏸ 暂停'}else{audio.pause();clearTimeout(followTimer);$('pause').textContent='▶ 继续'}};

// Fallback visual clock for speech engines without character boundary events.
let visualClock=null;function positionsForClock(i,offset){return Array.from(data[i].text.slice(0,offset)).filter(c=>/[\u3400-\u9fff0-9A-Za-z]/.test(c)).length}
function stopVisual(){clearInterval(visualClock);visualClock=null}
const originalSpeak=speakNew;
speakNew=function(i,keep,j){stopVisual();originalSpeak(i,keep,j);const u=utterance,t=token;if(!u||j!==undefined||mode!=='sentence')return;let elapsed=0,last=performance.now(),boundarySeen=false;const oldBoundary=u.onboundary;u.onboundary=e=>{boundarySeen=true;oldBoundary?.(e);elapsed=Math.max(0,positionsForClock(i,e.charIndex))*215/Number($('speed').value)};const oldStart=u.onstart;u.onstart=e=>{oldStart?.(e);last=performance.now();const positions=data[i].characters.map((c,k)=>({c,k})).filter(o=>/[\u3400-\u9fff0-9A-Za-z]/.test(o.c.char));if(!positions.length)return;setCurrent(i,positions[0].k);visualClock=setInterval(()=>{if(t!==token||mode!=='sentence'){stopVisual();return}const now=performance.now();if(!speechSynthesis.paused)elapsed+=now-last;last=now;if(true){const k=Math.min(positions.length-1,Math.floor(elapsed*Number($('speed').value)/215));if(positions[k].k>active)setCurrent(i,positions[k].k)}},45)};const oldEnd=u.onend;u.onend=e=>{stopVisual();if(t===token)setCurrent(i,data[i].characters.length);oldEnd?.(e)};};
