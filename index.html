<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角马大迁徙 · 有声跟读</title><style>body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#e9efe9;color:#1e342a;margin:0}.wrap{max-width:840px;margin:auto;padding:16px}header{background:#1c5947;color:white;padding:24px;border-radius:20px}h1{margin:0 0 8px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}button,select{font:inherit;padding:12px;border:1px solid #a9c6b7;border-radius:12px;background:white;cursor:pointer}.main{background:#fffefa;border-radius:18px;padding:clamp(16px,5vw,38px)}.line{padding:14px;margin:10px 0;border:2px solid transparent;border-radius:12px;font-size:clamp(21px,4vw,27px);line-height:1.9;cursor:pointer}.line.active{background:#ffedaa;border-color:#d6a436}.py{font-size:15px;color:#59776a;line-height:1.9;overflow-wrap:anywhere}.nav{display:flex;align-items:center;justify-content:space-between;margin:15px 0}.primary{background:#1f7758;color:white}.status{font-size:14px;min-height:22px;color:#7c4933}button:disabled{opacity:.45}</style><main class="wrap"><header><h1>角马大迁徙</h1>纯原文朗读 · 点击句子听读 · 全篇拼音</header><div class="tools"><button id="play" class="primary">▶ 朗读本段</button><button id="pause">⏸ 暂停</button><button id="stop">■ 停止</button><label>语速 <select id="speed"><option value="0.75">0.75×</option><option value="0.85" selected>0.85×</option><option value="1">1.0×</option></select></label><label><input id="show" type="checkbox" checked>显示拼音</label></div><div class="status" id="status">音频加载中……</div><section class="main"><h2 id="heading"></h2><div id="lines"></div></section><nav class="nav"><button id="prev">← 上一段</button><span id="counter"></span><button class="primary" id="next">下一段 →</button></nav><audio id="player" preload="auto"></audio></main><script>
let data=[],page=0,idx=-1,serial=false;const $=s=>document.getElementById(s),audio=$('player');function status(s){$('status').textContent=s}function stop(){audio.pause();audio.removeAttribute('src');audio.load();idx=-1;serial=false;mark()}function mark(){document.querySelectorAll('.line').forEach(el=>el.classList.toggle('active',Number(el.dataset.i)===idx))}function play(i,all=false){const items=data.filter(x=>x.para===page);if(!items[i]){stop();return}idx=i;serial=all;mark();audio.src=items[i].audio;audio.playbackRate=Number($('speed').value);audio.play().then(()=>status('正在朗读第 '+(i+1)+' 句')).catch(e=>status('无法播放音频：请确认 GitHub Actions 已生成 MP3。'+e.message))}audio.onended=()=>{const items=data.filter(x=>x.para===page);if(serial&&idx+1<items.length)play(idx+1,true);else{idx=-1;mark();status('播放完毕')}};audio.onerror=()=>status('音频不存在或无法读取。请检查 GitHub Actions 部署记录。');function render(){stop();const items=data.filter(x=>x.para===page);$('heading').textContent='第 '+(page+1)+' 段';$('counter').textContent=(page+1)+' / 7';$('prev').disabled=page===0;$('next').disabled=page===6;$('lines').replaceChildren();items.forEach((x,i)=>{let d=document.createElement('div');d.className='line';d.dataset.i=i;d.tabIndex=0;d.setAttribute('role','button');let t=document.createElement('div');t.textContent=x.text;let p=document.createElement('div');p.className='py';p.textContent=x.pinyin;p.hidden=!$('show').checked;d.append(t,p);d.onclick=()=>play(i);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play(i)}};$('lines').append(d)})} $('play').onclick=()=>play(0,true);$('pause').onclick=()=>{if(audio.paused&&audio.src){audio.play();$('pause').textContent='⏸ 暂停'}else{audio.pause();$('pause').textContent='▶ 继续'}};$('stop').onclick=stop;$('prev').onclick=()=>{if(page){page--;render()}};$('next').onclick=()=>{if(page<6){page++;render()}};$('show').onchange=()=>document.querySelectorAll('.py').forEach(x=>x.hidden=!$('show').checked);$('speed').onchange=()=>audio.playbackRate=Number($('speed').value);fetch('site_data.json').then(r=>{if(!r.ok)throw Error('未生成 site_data.json');return r.json()}).then(x=>{data=x;status('准备就绪：点击句子开始朗读');render()}).catch(e=>status('音频尚未生成：请先运行 build.py 或 GitHub Actions。'+e.message));
</script></html>
