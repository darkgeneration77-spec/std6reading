<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角马大迁徙 · 跟读歌词</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#18251e;font-family:system-ui,"Microsoft YaHei",sans-serif}.app{max-width:850px;margin:auto;min-height:100vh;padding:16px}header{text-align:center;padding:14px 0 12px}h1{font-size:27px;margin:0 0 5px}header p{margin:0;color:#425b4b;font-size:14px}.controls{position:sticky;top:0;z-index:4;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 6px;background:#ffffffed;backdrop-filter:blur(12px)}button,select{border:1px solid #b4cbbb;background:#f2f7f3;color:#183b28;border-radius:11px;padding:10px 14px;font-size:15px;cursor:pointer}.primary{background:#31a873;border-color:#31a873;color:#ffffff;font-weight:700}label{font-size:14px;color:#294b36}.lyrics{height:min(76vh,790px);overflow-y:auto;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#b3c9b8 transparent;padding:22vh 12px 30vh}.lyric{color:#20392b;margin:0 auto 26px;max-width:730px;text-align:center;opacity:1;transition:opacity .3s,transform .3s;cursor:pointer;line-height:1.8}.lyric.current{opacity:1;transform:scale(1.015);background:#f2f8f2;border-radius:18px;padding:12px 4px}.lyric.done{opacity:1}.linechars{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:0 1px}.char{color:#17281e;display:inline-flex;flex-direction:column;align-items:center;min-width:23px;border-radius:7px;padding:2px 0;vertical-align:bottom;cursor:pointer}.char .py{height:19px;font-size:12px;color:#496a53}.char .hz{font-size:17px;font-weight:650}.char.lit{background:#ffe08a;color:#17261c}.char.lit .py{color:#624b18}.char.past:not(.lit){color:#257a49}.punct{font-size:17px;padding:0 0 2px}.hidepy .py{display:none}.status{text-align:center;font-size:13px;color:#496451;min-height:24px}.progress{height:4px;background:#e4eee7;border-radius:10px;overflow:hidden;margin:7px 0}.progress div{height:100%;width:0;background:#75d5a0;transition:width .1s}.foot{text-align:center;color:#526f5b;font-size:13px;margin:8px}.lyric .linechars{margin-bottom:5px}@media(max-width:500px){.app{padding:7px}.lyrics{padding-left:3px;padding-right:3px}.char{min-width:23px}.controls{gap:5px}button,select{padding:9px}}
</style></head><body><main class="app"><header><h1>角马大迁徙</h1><p>听老师朗读 · 看文字同步亮起 · 跟着读</p></header><div class="controls"><button id="play" class="primary">▶ 从头朗读</button><button id="pause">⏸ 暂停</button><button id="repeat">↻ 重听当前句</button><label>语速 <select id="speed"><option value=".75">慢速</option><option value=".85" selected>跟读</option><option value="1">正常</option></select></label><label><input type="checkbox" id="showpy" checked>拼音</label></div><div class="status" id="status">正在加载课文……</div><div class="progress"><div id="progress"></div></div><section id="lyrics" class="lyrics"></section><p class="foot">点击任意一行从该句开始；点击单字可以听它的读音。</p><audio id="audio" preload="none"></audio></main><script>
const $=id=>document.getElementById(id);let data=[],idx=0,mode='',continuous=false,active=-1;const audio=$('audio');function status(s){$('status').textContent=s}
function stop(){audio.pause();audio.removeAttribute('src');audio.load();mode=''}
function chunk(chars){let result=[],line=[];for(let i=0;i<chars.length;i++){line.push({...chars[i],index:i});if(line.length>=26&&(chars[i].char.match(/[，。；！？、]/)||line.length>=32)){result.push(line);line=[]}}if(line.length)result.push(line);return result}
function make(){let box=$('lyrics');box.replaceChildren();data.forEach((x,i)=>{let line=document.createElement('div');line.className='lyric';line.dataset.sentence=i;for(let group of chunk(x.characters||[])){let row=document.createElement('div');row.className='linechars';for(let c of group){if(!c.audio&&!/[\u3400-\u9fff]/.test(c.char)){let p=document.createElement('span');p.className='punct';p.textContent=c.char;row.append(p);continue}let b=document.createElement('span');b.className='char';b.dataset.index=c.index;let py=document.createElement('span');py.className='py';py.textContent=c.py;let hz=document.createElement('span');hz.className='hz';hz.textContent=c.char;b.append(py,hz);b.onclick=e=>{e.stopPropagation();playCharacter(i,c.index)};row.append(b)}line.append(row)}line.onclick=()=>playSentence(i,true);box.append(line)});setCurrent(0,-1)}
function setCurrent(i,charIndex){idx=i;active=charIndex;document.querySelectorAll('.lyric').forEach((node,n)=>{node.classList.toggle('current',n===i);node.classList.toggle('done',n<i);node.querySelectorAll('.char').forEach(c=>{const j=Number(c.dataset.index);c.classList.toggle('lit',n===i&&j===charIndex);c.classList.toggle('past',n===i&&j<charIndex)})});const current=document.querySelector('.lyric.current');if(current&&mode==='sentence'){const target=current.querySelector('.char.lit')||current;const scroller=$('lyrics');const y=target.getBoundingClientRect().top-scroller.getBoundingClientRect().top+scroller.scrollTop-scroller.clientHeight*.44;scroller.scrollTo({top:Math.max(0,y),behavior:'smooth'});}$('progress').style.width=((i+(charIndex>=0?charIndex/Math.max(1,data[i]?.characters.length):0))/Math.max(1,data.length)*100)+'%'}
function playFile(src){audio.pause();audio.src=src;audio.playbackRate=Number($('speed').value);audio.play().catch(e=>status('无法播放：'+e.message))}
function playSentence(i,keep){if(!data[i])return;continuous=keep;mode='sentence';setCurrent(i,-1);status('老师正在朗读 · 第 '+(i+1)+' / '+data.length+' 句');playFile(data[i].audio);$('play').textContent='▶ 从头朗读'}
function playCharacter(i,j){let c=data[i]?.characters[j];if(!c?.audio){status('单字音频正在生成，可先听整句');return;}continuous=false;mode='character';setCurrent(i,j);status('单字：'+c.char);playFile(c.audio)}
audio.ontimeupdate=()=>{if(mode!=='sentence')return;let n=-1;const marks=data[idx].timing||[];if(marks.length){for(let t of marks){if(t.time<=audio.currentTime)n=t.index;else break}}else if(Number.isFinite(audio.duration)&&audio.duration>0){const chars=data[idx].characters;const speakable=chars.map((c,i)=>({c,i})).filter(o=>/[\\u3400-\\u9fff0-9]/.test(o.c.char));const step=Math.min(speakable.length-1,Math.floor(audio.currentTime/audio.duration*speakable.length));n=speakable[Math.max(0,step)]?.i??-1}if(n!==active)setCurrent(idx,n)};
audio.onended=()=>{if(mode==='sentence'&&continuous&&idx<data.length-1){playSentence(idx+1,true)}else{continuous=false;mode='';status('朗读结束，可以跟着读或重新播放')}};
audio.onerror=()=>status('音频未能加载，请等待 GitHub 部署完成');
$('play').onclick=()=>playSentence(0,true);$('repeat').onclick=()=>playSentence(idx,false);$('pause').onclick=()=>{if(audio.paused&&audio.src){audio.play().catch(()=>{});$('pause').textContent='⏸ 暂停'}else{audio.pause();$('pause').textContent='▶ 继续'}};$('speed').onchange=()=>audio.playbackRate=Number($('speed').value);$('showpy').onchange=()=> $('lyrics').classList.toggle('hidepy',!$('showpy').checked);
const EMBEDDED=[{"text":"每年6月，在非洲东部，成群结队的角马，从坦桑尼亚的塞伦盖蒂保护区出发，迁徙至肯尼亚的马赛马拉国家公园。","para":0,"audio":"audio/001.mp3"},{"text":"这场壮观的角马大迁徙被誉为“自然界七大奇观”之一。","para":0,"audio":"audio/002.mp3"},{"text":"其背后不仅有气势磅礴的景象，更蕴含着残酷的生存法则——这是动物们在大自然中争夺生存权的过程，也是大自然对它们的严苛考验。","para":0,"audio":"audio/003.mp3"},{"text":"角马又称牛羚，是牛科角马属动物，主要分布在撒哈拉沙漠以南的非洲地区。","para":1,"audio":"audio/004.mp3"},{"text":"它们以青草为食，尤其喜爱新鲜的嫩草。","para":1,"audio":"audio/005.mp3"},{"text":"然而，非洲草原终年高温干旱，雨季一过，草木枯黄，水源逐渐干涸。","para":1,"audio":"audio/006.mp3"},{"text":"为了寻找食物和水源，角马必须踏上漫长的迁徙之路。","para":1,"audio":"audio/007.mp3"},{"text":"角马是群居动物。","para":2,"audio":"audio/008.mp3"},{"text":"到了迁徙季节，它们会自动聚集在一起，并与成群的斑马等动物结伴而行，展开长达数月的长途跋涉。","para":2,"audio":"audio/009.mp3"},{"text":"即使是刚出生不久的小角马，也必须随群同行。","para":2,"audio":"audio/010.mp3"},{"text":"为了生存，它们必须经受一路上的严酷考验，只有存活下来，才能继续繁衍。","para":2,"audio":"audio/011.mp3"},{"text":"在漫长的迁徙途中，由于路途遥远、自然环境复杂，一路危险重重，杀机四伏。","para":3,"audio":"audio/012.mp3"},{"text":"最危险的关卡就是横亘在草原上的马拉河，河中潜伏着鳄鱼和河马，伺机捕食过河的角马。","para":3,"audio":"audio/013.mp3"},{"text":"当百万角马集体渡河时，被踩踏、溺亡和被捕食几乎每时每刻都在发生。","para":3,"audio":"audio/014.mp3"},{"text":"据统计，每年有数千头角马死在这里，因此这一地段被称为“死亡之角”。","para":3,"audio":"audio/015.mp3"},{"text":"除了渡河的险境，角马们还要面对狮子、猎豹和非洲野犬等天敌的追捕。","para":4,"audio":"audio/016.mp3"},{"text":"生死搏斗随处可见，这就是残酷而真实的自然法则——优胜劣汰。","para":4,"audio":"audio/017.mp3"},{"text":"在9月至11月之间，马赛马拉草原遍布迁徙动物的身影，一些幸运的角马能在这里享受短暂的休养生息。","para":5,"audio":"audio/018.mp3"},{"text":"但到了11月至12月，草原食物几乎被消耗殆尽，而塞伦盖蒂草原则迎来雨季，草木开始复苏。","para":5,"audio":"audio/019.mp3"},{"text":"角马们又踏上返程，然而能成功回到原地的仅占原来数量的40%。","para":5,"audio":"audio/020.mp3"},{"text":"幸运的是，成功返回的角马会在次年1月至3月繁衍后代，这些新生命将成为下一次大迁徙的主力军。","para":5,"audio":"audio/021.mp3"},{"text":"角马的生存策略，就是通过不断迁徙来获取充足的水源和食物。","para":6,"audio":"audio/022.mp3"},{"text":"因此，每年东非大草原上都会上演这场壮美而震撼的自然奇观。","para":6,"audio":"audio/023.mp3"}];
function normalize(x){return x.map((item,i)=>{if(!Array.isArray(item.characters)||item.characters.length===0){item.characters=Array.from(item.text||'').map(c=>({char:c,py:'',audio:null}));}if(!Array.isArray(item.timing))item.timing=[];if(!item.audio)item.audio='audio/'+String(i+1).padStart(3,'0')+'.mp3';return item})}
data=normalize(EMBEDDED);make();status('课文已显示 · 点击播放开始跟读');
fetch('site_data.json?version=20261111c',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('数据未部署');return r.json()}).then(x=>{if(Array.isArray(x)&&x.length===data.length){const old=idx;data=normalize(x);make();setCurrent(old,active);status('课文已显示 · 可以开始朗读')}}).catch(e=>status('课文已显示；逐字拼音及同步音频正在准备中'));
</script></body></html>
