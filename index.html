<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角马大迁徙 · 逐字跟读</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3ee;color:#1c4134;font-family:system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:960px;margin:auto;padding:14px}header{background:#205b49;color:white;padding:20px 25px;border-radius:20px}h1{margin:0;font-size:29px}header p{margin:7px 0 0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,select{background:white;border:1px solid #b9d1c3;border-radius:13px;padding:12px;font-size:16px;cursor:pointer}.primary{background:#197b59;color:white}.paper{background:#fffefa;border-radius:22px;padding:clamp(14px,4vw,30px);min-height:310px}.heading{color:#567669;font-size:15px;margin-bottom:15px}.sentence{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 3px;line-height:1.2}.glyph{display:flex;flex-direction:column;align-items:center;justify-content:end;min-width:clamp(40px,7vw,65px);padding:7px 3px 9px;border-radius:11px;border:2px solid transparent;background:transparent;cursor:pointer;color:#173b30}.glyph .py{font-size:clamp(12px,2vw,17px);height:27px;white-space:nowrap;color:#5a7869}.glyph .hz{font-size:clamp(32px,5.5vw,51px);font-weight:650}.glyph.active{background:#ffe8a1;border-color:#dba936}.punct{font-size:clamp(27px,5vw,45px);padding:0 2px 10px}.hidepy .py{visibility:hidden}.status{font-size:14px;color:#567669;margin:8px 0;min-height:22px}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0}.nav button:disabled{opacity:.35}.count{font-size:15px;font-weight:700}.hint{font-size:14px;color:#667e72;margin:20px 0 0}@media(max-width:480px){.wrap{padding:8px}.sentence{gap:5px 0}.glyph{min-width:43px}.tools button{padding:10px}}
</style><main class="wrap"><header><h1>角马大迁徙</h1><p>看着字 · 听老师读 · 跟着读</p></header><div class="tools"><button id="play" class="primary">▶ 老师读一句</button><button id="pause">⏸ 暂停</button><button id="repeat">↻ 重读本句</button><label>语速 <select id="speed"><option value=".7">慢速</option><option value=".85" selected>跟读</option><option value="1">正常</option></select></label><label><input type="checkbox" id="showpy" checked> 显示拼音</label></div><div class="status" id="status">正在加载……</div><section class="paper"><div class="heading" id="heading"></div><div class="sentence" id="sentence"></div><p class="hint">点任何一个汉字，可以单独听这个字。听完一句，再按「下一句」。</p></section><nav class="nav"><button id="prev">← 上一句</button><span id="count" class="count"></span><button id="next" class="primary">下一句 →</button></nav><audio id="audio" preload="none"></audio></main><script>
let data=[],position=0,active=-1,mode='';const $=id=>document.getElementById(id),audio=$('audio');function status(t){$('status').textContent=t}function stop(){audio.pause();audio.removeAttribute('src');audio.load();mode='';active=-1}function setActive(i){active=i;document.querySelectorAll('.glyph').forEach(el=>el.classList.toggle('active',+el.dataset.index===i));let node=document.querySelector('.glyph.active');if(node)node.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}function render(){stop();if(!data.length)return;const item=data[position];$('heading').textContent='第 '+(item.para+1)+' 段 · 第 '+(position+1)+' 句';$('count').textContent=(position+1)+' / '+data.length;$('prev').disabled=position===0;$('next').disabled=position===data.length-1;const box=$('sentence');box.replaceChildren();item.characters.forEach((obj,i)=>{if(!obj.audio){let s=document.createElement('span');s.className='punct';s.textContent=obj.char;box.append(s);return}let b=document.createElement('button');b.className='glyph';b.dataset.index=i;let py=document.createElement('span');py.className='py';py.textContent=obj.py;let hz=document.createElement('span');hz.className='hz';hz.textContent=obj.char;b.append(py,hz);b.onclick=()=>playChar(i);box.append(b)});box.classList.toggle('hidepy',!$('showpy').checked);status('点击「老师读一句」或任意汉字开始朗读')}function playFile(src){audio.pause();audio.src=src;audio.playbackRate=Number($('speed').value);audio.play().catch(e=>status('音频播放失败：'+e.message))}function playSentence(){if(!data.length)return;mode='sentence';setActive(-1);playFile(data[position].audio);status('老师正在朗读，请看黄色高亮的字')}function playChar(i){const c=data[position].characters[i];if(!c.audio)return;mode='character';setActive(i);playFile(c.audio);status('单字朗读：'+c.char)}audio.ontimeupdate=()=>{if(mode!=='sentence')return;const t=audio.currentTime;let n=-1;for(const mark of (data[position].timing||[])){if(mark.time<=t)n=mark.index;else break}if(n!==active)setActive(n)};audio.onended=()=>{if(mode==='sentence')status('老师读完了，现在轮到你跟读。');else status('再读一次，或继续听整句');mode='';setActive(-1)};audio.onerror=()=>status('音频加载失败，请确认网站部署已完成');$('play').onclick=playSentence;$('repeat').onclick=playSentence;$('pause').onclick=()=>{if(audio.paused&&audio.src){audio.play();$('pause').textContent='⏸ 暂停'}else{audio.pause();$('pause').textContent='▶ 继续'}};$('prev').onclick=()=>{if(position>0){position--;render()}};$('next').onclick=()=>{if(position<data.length-1){position++;render()}};$('showpy').onchange=()=> $('sentence').classList.toggle('hidepy',!$('showpy').checked);$('speed').onchange=()=>audio.playbackRate=Number($('speed').value);fetch('site_data.json').then(r=>{if(!r.ok)throw Error('朗读数据未生成');return r.json()}).then(x=>{data=x;render()}).catch(e=>status('加载失败：'+e.message));
</script></html>
