<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角马大迁徙 · 跟读歌词</title><style>
*{box-sizing:border-box}body{margin:0;background:#101e1a;color:#eaf5ef;font-family:system-ui,"Microsoft YaHei",sans-serif}.app{max-width:850px;margin:auto;min-height:100vh;padding:16px}header{text-align:center;padding:14px 0 12px}h1{font-size:27px;margin:0 0 5px}header p{margin:0;color:#a4b9ae;font-size:14px}.controls{position:sticky;top:0;z-index:4;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 6px;background:#101e1aef;backdrop-filter:blur(12px)}button,select{border:1px solid #426555;background:#203b30;color:#fff;border-radius:11px;padding:10px 14px;font-size:15px;cursor:pointer}.primary{background:#31a873;border-color:#31a873;color:#081a12;font-weight:700}label{font-size:14px;color:#c2d3c8}.lyrics{height:min(72vh,680px);overflow-y:auto;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#426555 transparent;mask-image:linear-gradient(transparent,#000 9%,#000 88%,transparent);padding:30vh 12px 35vh}.lyric{margin:0 auto 22px;max-width:730px;text-align:center;opacity:.38;transition:opacity .3s,transform .3s;cursor:pointer;line-height:1.8}.lyric.current{opacity:1;transform:scale(1.015)}.lyric.done{opacity:.54}.linechars{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:0 1px}.char{display:inline-flex;flex-direction:column;align-items:center;min-width:clamp(30px,5vw,45px);border-radius:7px;padding:2px 0;vertical-align:bottom;cursor:pointer}.char .py{height:23px;font-size:clamp(11px,1.8vw,15px);color:#9db9a9}.char .hz{font-size:clamp(27px,4.5vw,40px);font-weight:650}.char.lit{background:#ffe59b;color:#26351b}.char.lit .py{color:#65582b}.char.past:not(.lit){color:#8be4af}.punct{font-size:clamp(26px,4.5vw,39px);padding:0 0 2px}.hidepy .py{display:none}.status{text-align:center;font-size:13px;color:#b1c7b9;min-height:24px}.progress{height:4px;background:#294337;border-radius:10px;overflow:hidden;margin:7px 0}.progress div{height:100%;width:0;background:#75d5a0;transition:width .1s}.foot{text-align:center;color:#a2b9ac;font-size:13px;margin:8px}.lyric .linechars{margin-bottom:5px}@media(max-width:500px){.app{padding:7px}.lyrics{padding-left:3px;padding-right:3px}.char{min-width:31px}.controls{gap:5px}button,select{padding:9px}}
</style></head><body><main class="app"><header><h1>角马大迁徙</h1><p>听老师朗读 · 看文字同步亮起 · 跟着读</p></header><div class="controls"><button id="play" class="primary">▶ 从头朗读</button><button id="pause">⏸ 暂停</button><button id="repeat">↻ 重听当前句</button><label>语速 <select id="speed"><option value=".75">慢速</option><option value=".85" selected>跟读</option><option value="1">正常</option></select></label><label><input type="checkbox" id="showpy" checked>拼音</label></div><div class="status" id="status">正在加载课文……</div><div class="progress"><div id="progress"></div></div><section id="lyrics" class="lyrics"></section><p class="foot">点击任意一行从该句开始；点击单字可以听它的读音。</p><audio id="audio" preload="none"></audio></main><script>
const $=id=>document.getElementById(id);let data=[],idx=0,mode='',continuous=false,active=-1;const audio=$('audio');function status(s){$('status').textContent=s}
function stop(){audio.pause();audio.removeAttribute('src');audio.load();mode=''}
function chunk(chars){let result=[],line=[];for(let i=0;i<chars.length;i++){line.push({...chars[i],index:i});if(line.length>=13&&(chars[i].char.match(/[，。；！？、]/)||line.length>=17)){result.push(line);line=[]}}if(line.length)result.push(line);return result}
function make(){let box=$('lyrics');box.replaceChildren();data.forEach((x,i)=>{let line=document.createElement('div');line.className='lyric';line.dataset.sentence=i;for(let group of chunk(x.characters)){let row=document.createElement('div');row.className='linechars';for(let c of group){if(!c.audio){let p=document.createElement('span');p.className='punct';p.textContent=c.char;row.append(p);continue}let b=document.createElement('span');b.className='char';b.dataset.index=c.index;let py=document.createElement('span');py.className='py';py.textContent=c.py;let hz=document.createElement('span');hz.className='hz';hz.textContent=c.char;b.append(py,hz);b.onclick=e=>{e.stopPropagation();playCharacter(i,c.index)};row.append(b)}line.append(row)}line.onclick=()=>playSentence(i,true);box.append(line)});setCurrent(0,-1)}
function setCurrent(i,charIndex){idx=i;active=charIndex;document.querySelectorAll('.lyric').forEach((node,n)=>{node.classList.toggle('current',n===i);node.classList.toggle('done',n<i);node.querySelectorAll('.char').forEach(c=>{const j=Number(c.dataset.index);c.classList.toggle('lit',n===i&&j===charIndex);c.classList.toggle('past',n===i&&j<charIndex)})});const current=document.querySelector('.lyric.current');if(current)current.scrollIntoView({behavior:'smooth',block:'center'});$('progress').style.width=((i+(charIndex>=0?charIndex/Math.max(1,data[i]?.characters.length):0))/Math.max(1,data.length)*100)+'%'}
function playFile(src){audio.pause();audio.src=src;audio.playbackRate=Number($('speed').value);audio.play().catch(e=>status('无法播放：'+e.message))}
function playSentence(i,keep){if(!data[i])return;continuous=keep;mode='sentence';setCurrent(i,-1);status('老师正在朗读 · 第 '+(i+1)+' / '+data.length+' 句');playFile(data[i].audio);$('play').textContent='▶ 从头朗读'}
function playCharacter(i,j){let c=data[i]?.characters[j];if(!c?.audio)return;continuous=false;mode='character';setCurrent(i,j);status('单字：'+c.char);playFile(c.audio)}
audio.ontimeupdate=()=>{if(mode!=='sentence')return;let n=-1;for(let t of(data[idx].timing||[])){if(t.time<=audio.currentTime)n=t.index;else break}if(n!==active)setCurrent(idx,n)};
audio.onended=()=>{if(mode==='sentence'&&continuous&&idx<data.length-1){playSentence(idx+1,true)}else{continuous=false;mode='';status('朗读结束，可以跟着读或重新播放')}};
audio.onerror=()=>status('音频未能加载，请等待 GitHub 部署完成');
$('play').onclick=()=>playSentence(0,true);$('repeat').onclick=()=>playSentence(idx,false);$('pause').onclick=()=>{if(audio.paused&&audio.src){audio.play().catch(()=>{});$('pause').textContent='⏸ 暂停'}else{audio.pause();$('pause').textContent='▶ 继续'}};$('speed').onchange=()=>audio.playbackRate=Number($('speed').value);$('showpy').onchange=()=> $('lyrics').classList.toggle('hidepy',!$('showpy').checked);
fetch('site_data.json').then(r=>{if(!r.ok)throw Error('数据未部署');return r.json()}).then(x=>{data=x;make();status('准备就绪 · 点击播放，像看歌词一样跟着朗读')}).catch(e=>status('加载失败：'+e.message));
</script></body></html>
