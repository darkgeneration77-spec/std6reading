<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角马大迁徙 · 逐词跟读</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3ee;color:#183d32;font-family:"Microsoft YaHei",system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}header{background:#195b48;color:white;border-radius:22px;padding:24px}h1{margin:0;font-size:32px}header p{margin:8px 0 0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:17px 0}.bar button,.bar select,.nav button{border:1px solid #b3cfc2;border-radius:13px;background:white;padding:12px;font-size:16px;cursor:pointer}.bar .mainbtn,.nav .mainbtn{background:#197858;color:white}.paper{background:#fffefb;border-radius:24px;padding:20px;min-height:350px;box-shadow:0 8px 26px #153d2510}.tip{font-size:15px;color:#567366}.focus{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f8ef;border-radius:22px;padding:22px;margin:15px 0;min-height:210px}.focus .han{font-size:clamp(55px,11vw,100px);font-weight:750;letter-spacing:.08em;text-align:center}.focus .pin{font-size:clamp(22px,4vw,31px);color:#537667;text-align:center}.words{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.word{min-width:78px;min-height:93px;padding:9px 13px;border:2px solid #d5e4d9;border-radius:17px;background:white;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}.word .p{font-size:16px;color:#607d70;min-height:25px}.word .h{font-size:clamp(28px,5vw,39px);font-weight:650}.word.active{border-color:#ddaa25;background:#fff1b9}.word.done{background:#e6f6ec}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.status{font-size:14px;color:#526d60;min-height:20px}.sentence{font-size:19px;line-height:1.8;padding:12px;background:#f7f9f5;border-radius:13px;margin-top:12px}.hide{display:none!important}button:disabled{opacity:.4}.pager{font-weight:700}label{display:flex;align-items:center;gap:5px} @media(max-width:500px){.wrap{padding:9px}.paper{padding:13px}.word{min-width:66px}.focus{padding:12px}}
</style></head><body><div class="wrap"><header><h1>角马大迁徙</h1><p>看清一个词 · 听一次 · 跟着读</p></header>
<div class="bar"><button class="mainbtn" id="listen">▶ 听这个词</button><button id="nextWord">下一个词 →</button><button id="auto">▶ 逐词连续听</button><button id="sentencePlay">朗读整句</button><label>语速 <select id="speed"><option value=".7">慢</option><option value=".85" selected>标准跟读</option><option value="1">正常</option></select></label><label><input id="pinyin" type="checkbox" checked>拼音</label></div>
<div class="status" id="status">正在加载课文……</div><section class="paper"><div class="tip" id="heading"></div><div class="focus"><div class="pin" id="focusPin"></div><div class="han" id="focusHan"></div></div><div class="tip">点击下面任何词语，听老师朗读。</div><div class="words" id="words"></div><div class="sentence" id="sentence"></div></section>
<div class="nav"><button id="prev">← 上一句</button><span class="pager" id="counter"></span><button class="mainbtn" id="next">下一句 →</button></div><audio id="player" preload="none"></audio></div>
<script>
let data=[],si=0,wi=0,auto=false,playingSentence=false;const $=id=>document.getElementById(id),audio=$('player');
function sayStatus(t){$('status').textContent=t}function units(){return data[si]?.units||[]}function valid(i){return units()[i]&&units()[i].audio}
function skip(i,step=1){while(i>=0&&i<units().length&&!valid(i))i+=step;return i}
function stop(){auto=false;audio.pause();audio.removeAttribute('src');audio.load()}
function render(){stop();if(!data.length)return;const x=data[si];wi=skip(0);$('heading').textContent='第 '+(x.para+1)+' 段 · 第 '+(si+1)+' 句';$('counter').textContent=(si+1)+' / '+data.length;$('prev').disabled=si===0;$('next').disabled=si===data.length-1;$('sentence').textContent=x.text;draw()}
function draw(){const list=units();const current=list[wi];$('focusHan').textContent=current?.text||'完成';$('focusPin').textContent=$('pinyin').checked?(current?.pinyin||''):'';$('words').replaceChildren();list.forEach((u,i)=>{if(!u.audio)return;let b=document.createElement('button');b.className='word'+(i===wi?' active':'')+(i<wi?' done':'');let p=document.createElement('span');p.className='p';p.textContent=$('pinyin').checked?u.pinyin:'';let h=document.createElement('span');h.className='h';h.textContent=u.text;b.append(p,h);b.onclick=()=>{auto=false;wi=i;playWord()};$('words').append(b)})}
function playSrc(src){audio.pause();audio.src=src;audio.playbackRate=Number($('speed').value);audio.play().catch(e=>sayStatus('无法播放：'+e.message))}
function playWord(){if(!valid(wi))return;playingSentence=false;draw();sayStatus('听清楚，再跟读：'+units()[wi].text);playSrc(units()[wi].audio)}
$('listen').onclick=()=>{auto=false;playWord()};
$('nextWord').onclick=()=>{auto=false;let n=skip(wi+1);if(n<units().length){wi=n;playWord()}else if(si<data.length-1){si++;render();playWord()}};
$('auto').onclick=()=>{auto=true;wi=skip(wi);playWord();auto=true};
$('sentencePlay').onclick=()=>{auto=false;playingSentence=true;sayStatus('正在朗读整句');playSrc(data[si].audio)};
audio.onended=()=>{if(auto&&!playingSentence){let n=skip(wi+1);if(n<units().length){wi=n;playWord();auto=true}else{auto=false;sayStatus('本句跟读完成')}}};
audio.onerror=()=>sayStatus('这段音频未能加载，请检查 GitHub Pages 部署是否完成');
$('prev').onclick=()=>{if(si>0){si--;render()}};$('next').onclick=()=>{if(si<data.length-1){si++;render()}};
$('pinyin').onchange=draw;$('speed').onchange=()=>audio.playbackRate=Number($('speed').value);
fetch('site_data.json').then(r=>{if(!r.ok)throw Error('朗读数据尚未部署');return r.json()}).then(x=>{data=x;render();sayStatus('准备就绪，点击词语开始跟读')}).catch(e=>sayStatus('加载失败：'+e.message));
</script></body></html>
