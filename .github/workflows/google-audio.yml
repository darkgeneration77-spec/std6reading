name: Generate Mandarin audio
on:
  push:
    paths:
      - '.github/workflows/google-audio.yml'
      - 'generate_google_audio.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gTTS pypinyin
      - run: python generate_google_audio.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-audio
          git diff --cached --quiet || git commit -m "Publish Mandarin MP3 files"
          git pull --rebase
          git push
